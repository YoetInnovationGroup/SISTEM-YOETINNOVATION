    <script>
      // Guard against iframe sandbox restrictions on window.fetch assignment
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || origFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if defineProperty fails
        }
      })();
    </script>
